<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1412" />
    <meta
      name="description"
      content="Inkwell — a modern publishing space for thoughtful writing. Built with React, Firebase Authentication and realtime Firestore."
    />
    <meta property="og:title" content="Inkwell — Write what matters" />
    <meta
      property="og:description"
      content="A modern blog platform with realtime posts, rich previews, search and a complete Firebase deployment guide."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('inkwell.theme')
        var dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.dataset.theme = 'dark'
      } catch (error) {
        /* storage can be unavailable in private mode */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Inkwell — Write what matters</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
